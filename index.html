<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aperitivo — Italian Cocktails</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Salute! · Cin cin!</p>
      <h1>Aperitivo</h1>
      <p class="tagline">Classic Italian cocktails, from the bars of Milan, Venice and Florence.</p>
      <div class="search-row">
        <input id="search" type="search" placeholder="Search cocktails or ingredients…" aria-label="Search cocktails" />
        <button id="random-btn" class="btn btn-ghost" type="button" title="Pick a random cocktail">Sorprendimi</button>
      </div>
    </div>
  </header>

  <main class="container">
    <nav class="filters" id="filters" aria-label="Filter by category"></nav>

    <div class="toolbar">
      <p id="result-count" class="result-count"></p>
      <div class="unit-toggle" role="group" aria-label="Units">
        <button type="button" data-unit="ml" class="active">ml</button>
        <button type="button" data-unit="oz">oz</button>
      </div>
    </div>

    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>Nessun cocktail found. Try another search.</p>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <article class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" type="button" aria-label="Close" data-close>&times;</button>
      <div id="modal-body"></div>
    </article>
  </div>

  <footer class="footer">
    <p>Bevi responsabilmente — please drink responsibly.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
